android {
  compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
  }
}

def cordovaVars = file("../capacitor-cordova-android-plugins/cordova.variables.gradle")
if (!cordovaVars.exists()) {
    cordovaVars = file("./capacitor-cordova-android-plugins/cordova.variables.gradle")
}
if (!cordovaVars.exists()) {
    cordovaVars = file("android/capacitor-cordova-android-plugins/cordova.variables.gradle")
}
if (cordovaVars.exists()) {
    apply from: cordovaVars
}

dependencies {
    implementation project(':capacitor-splash-screen')
    implementation project(':capacitor-status-bar')
}

if (hasProperty('postBuildExtras')) {
  postBuildExtras()
}
