<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Clean Pure White Studio Background -->
  <rect width="600" height="700" fill="#FFFFFF" />
  
  <!-- Subtle Glow / Aura -->
  <circle cx="300" cy="300" r="220" fill="#F8FAFC" />
  <circle cx="300" cy="300" r="180" fill="#F5F3FF" opacity="0.6" />

  <!-- Abstract Sleek Silhouette of Founder in Black Hoodie -->
  <!-- Shoulders & Torso (Black Hoodie) -->
  <path d="M 120 700 C 130 540, 200 450, 240 430 L 260 490 L 340 490 L 360 430 C 400 450, 470 540, 480 700 Z" fill="url(#hoodieGrad)" />
  
  <!-- Hoodie Zipper / Drawstrings Detail -->
  <line x1="285" y1="480" x2="285" y2="580" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <line x1="315" y1="480" x2="315" y2="580" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <circle cx="285" cy="585" r="4" fill="#D97706" />
  <circle cx="315" cy="585" r="4" fill="#D97706" />

  <!-- Head & Hood Structure -->
  <path d="M 210 320 C 200 180, 400 180, 390 320 C 390 410, 210 410, 210 320 Z" fill="#0F172A" />
  <!-- Inner Hood Void / Face Silhouette -->
  <ellipse cx="300" cy="300" rx="65" ry="85" fill="#1E293B" />
  <ellipse cx="300" cy="300" rx="50" ry="65" fill="#334155" opacity="0.3" />

  <!-- Creator Badge Emblem on Chest -->
  <g transform="translate(300, 520)">
    <circle cx="0" cy="0" r="28" fill="#5B21B6" />
    <polygon points="-8,-12 12,0 -8,12" fill="#F59E0B" />
  </g>

  <!-- Bottom Brand Overlay Label -->
  <rect x="180" y="630" width="240" height="38" rx="19" fill="#0F172A" />
  <text x="300" y="654" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">KP HUBE FOUNDER</text>
</svg>
