<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4C1D95" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#purpleGrad)" />
  
  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#A78BFA" stroke-width="4" stroke-opacity="0.25" />

  <!-- Geometric Crest / Play Hexagon -->
  <g transform="translate(256, 210)" filter="url(#shadow)">
    <!-- Golden Play Button Triangle / Hexagon Shield -->
    <polygon points="-50,-80 70,0 -50,80" fill="url(#goldGrad)" rx="8" />
  </g>

  <!-- Typography: KP HUBE -->
  <text x="256" y="380" font-family="'Outfit', sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">KP HUBE</text>
  
  <!-- Tagline: LEARN • GROW • SUCCEED -->
  <text x="256" y="425" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="19" fill="#FCD34D" text-anchor="middle" letter-spacing="5">LEARN • GROW • SUCCEED</text>
</svg>
