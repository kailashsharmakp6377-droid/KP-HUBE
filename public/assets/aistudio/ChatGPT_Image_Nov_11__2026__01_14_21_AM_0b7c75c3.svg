<!-- phone 1 --> <g filter="url(#shadow)" transform="translate(72 220)"><rect width="330" height="640" rx="34" fill="white"/><rect x="119" y="12" width="92" height="7" rx="4" fill="#e5e9f2"/><text x="28" y="67" font-family="Arial" font-size="17" font-weight="700" fill="#4f46e5">KP HUBE</text><text x="28" y="145" font-family="Arial" font-size="30" font-weight="700" fill="#14213d">Learn something</text><text x="28" y="181" font-family="Arial" font-size="30" font-weight="700" fill="#14213d">great today.</text><text x="28" y="220" font-family="Arial" font-size="14" fill="#66748c">Sign in to continue your journey</text><text x="28" y="288" font-family="Arial" font-size="13" font-weight="700" fill="#25324b">Mobile number</text><rect x="28" y="303" width="274" height="54" rx="13" fill="#f7f8fc" stroke="#dfe4ef"/><text x="43" y="336" font-family="Arial" font-size="15" fill="#8792a8">+91  |  Enter phone number</text><rect x="28" y="380" width="274" height="54" rx="14" fill="url(#hero)"/><text x="165" y="414" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">Continue</text><text x="165" y="468" text-anchor="middle" font-family="Arial" font-size="12" fill="#8993a8">By continuing, you agree to our</text><text x="165" y="488" text-anchor="middle" font-family="Arial" font-size="12" fill="#4f46e5">Terms of Service &amp; Privacy Policy</text><text x="165" y="588" text-anchor="middle" font-family="Arial" font-size="12" fill="#9aa3b5">Secure sign-in with OTP</text></g>
<!-- phone2 --> <g filter="url(#shadow)" transform="translate(460 220)"><rect width="330" height="640" rx="34" fill="white"/><rect x="119" y="12" width="92" height="7" rx="4" fill="#e5e9f2"/><text x="28" y="67" font-family="Arial" font-size="17" font-weight="700" fill="#4f46e5">KP HUBE</text><circle cx="165" cy="153" r="42" fill="#eef2ff"/><text x="165" y="166" text-anchor="middle" font-family="Arial" font-size="34" fill="#4f46e5">✓</text><text x="165" y="238" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#14213d">Verify your number</text><text x="165" y="272" text-anchor="middle" font-family="Arial" font-size="14" fill="#66748c">Enter the 6-digit code sent to</text><text x="165" y="297" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#25324b">+91  ••••••4821</text><g fill="#f7f8fc" stroke="#dfe4ef"><rect x="34" y="330" width="38" height="50" rx="10"/><rect x="83" y="330" width="38" height="50" rx="10"/><rect x="132" y="330" width="38" height="50" rx="10"/><rect x="181" y="330" width="38" height="50" rx="10"/><rect x="230" y="330" width="38" height="50" rx="10"/><rect x="279" y="330" width="24" height="50" rx="8"/></g><text x="165" y="424" text-anchor="middle" font-family="Arial" font-size="13" fill="#66748c">Resend code in 00:24</text><rect x="28" y="463" width="274" height="54" rx="14" fill="url(#hero)"/><text x="165" y="497" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">Verify &amp; continue</text><text x="165" y="580" text-anchor="middle" font-family="Arial" font-size="12" fill="#9aa3b5">Your account stays protected</text></g>
<!-- phone3 --> <g filter="url(#shadow)" transform="translate(848 220)"><rect width="330" height="640" rx="34" fill="white"/><rect x="119" y="12" width="92" height="7" rx="4" fill="#e5e9f2"/><text x="25" y="65" font-family="Arial" font-size="17" font-weight="700" fill="#4f46e5">KP HUBE</text><text x="25" y="111" font-family="Arial" font-size="24" font-weight="700" fill="#14213d">Find your next course</text><text x="25" y="140" font-family="Arial" font-size="13" fill="#66748c">Learn at your pace, from anywhere</text><rect x="25" y="164" width="280" height="145" rx="18" fill="url(#hero)"/><circle cx="251" cy="217" r="48" fill="#ffffff" opacity=".18"/><path d="M240 195l32 22-32 22z" fill="white"/><text x="45" y="202" font-family="Arial" font-size="12" font-weight="700" fill="#dff8ff">FEATURED COURSE</text><text x="45" y="235" font-family="Arial" font-size="22" font-weight="700" fill="white">Complete Learning</text><text x="45" y="262" font-family="Arial" font-size="22" font-weight="700" fill="white">Pathway</text><text x="25" y="352" font-family="Arial" font-size="17" font-weight="700" fill="#14213d">Course includes</text><text x="25" y="383" font-family="Arial" font-size="14" fill="#52617a">✓  24 video lessons</text><text x="25" y="409" font-family="Arial" font-size="14" fill="#52617a">✓  Downloadable resources</text><text x="25" y="435" font-family="Arial" font-size="14" fill="#52617a">✓  Learn on any device</text><text x="25" y="488" font-family="Arial" font-size="13" fill="#66748c">ONE-TIME ENROLLMENT</text><text x="25" y="520" font-family="Arial" font-size="27" font-weight="700" fill="#14213d">₹499</text><rect x="25" y="542" width="280" height="52" rx="14" fill="#4f46e5"/><text x="165" y="575" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Buy course</text></g>
