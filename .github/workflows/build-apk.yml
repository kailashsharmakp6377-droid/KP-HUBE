name: Android APK Build and GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Raw Java version string: $RAW_VERSION"
          if [ -z "$RAW_VERSION" ]; then
            echo "ERROR: Active Java version cannot be detected." >&2
            exit 1
          fi
          MAJOR_VERSION=$(echo "$RAW_VERSION" | sed -E 's/^1\.([0-9]+).*/\1/; s/^([0-9]+).*/\1/')
          echo "Detected Java major version: $MAJOR_VERSION"
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to parse Java major version from '$RAW_VERSION'." >&2
            exit 1
          fi
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Active Java major version is $MAJOR_VERSION, which is lower than required version 17." >&2
            exit 1
          fi
          echo "Java environment verified: Java $MAJOR_VERSION (>= 17) is active."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore using Java 17 keytool..."
            "$JAVA_HOME/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore" >&2
            exit 1
          fi
          echo "Temporary debug.keystore successfully verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            fi
            echo "ERROR: Expected debug APK ($APK_PATH) does not exist." >&2
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is not a regular file." >&2
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is empty (0 bytes)." >&2
            exit 1
          fi

          if [[ "$APK_PATH" != *.apk ]]; then
            echo "ERROR: $APK_PATH does not have .apk extension." >&2
            exit 1
          fi

          if [ "$APK_PATH" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk" >&2
            exit 1
          fi

          echo "APK successfully verified at: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g; s/^-+|-+$//g')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="app"
          fi
          ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          
          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_ASSET_DIR"
          
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="${TEMP_ASSET_DIR}/${ASSET_NAME}"
          
          cp "$SRC_APK" "$DEST_APK"
          
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_APK" >&2
            exit 1
          fi
          
          echo "Prepared release asset: $DEST_APK"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "ERROR: Prepared release asset is missing or empty: $RELEASE_ASSET" >&2
            exit 1
          fi
          if [[ "$RELEASE_ASSET" != *.apk ]]; then
            echo "ERROR: Release asset does not have .apk extension: $RELEASE_ASSET" >&2
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### KP HUBE Android Debug APK Build
          
          - **Build Type:** Automatically generated debug APK
          - **Built by:** GitHub Actions
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit:** ${GITHUB_SHA}
          
          > **Notice:**
          > - This APK is intended strictly for testing and validation.
          > - This APK is **not** a Play Store production release.
          > - This APK is signed only with a temporary debug keystore.
          EOF
          )
          
          echo "Creating GitHub Release $RELEASE_TAG targeting $GITHUB_SHA..."
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=========================================================="
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            echo "=========================================================="
            
            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** Debug APK Build #${GITHUB_RUN_NUMBER}"
              echo "- **Direct Download URL:** [${RELEASE_URL}](${RELEASE_URL})"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo ""
              echo "The APK is directly downloadable under the **Assets** section of the release above."
              echo "The standard GitHub Actions workflow artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=========================================================="
            echo "WARNING: GitHub Release publishing did not complete successfully."
            echo "The debug APK build and artifact upload completed successfully."
            echo "The compiled APK is preserved and available via the Actions artifact named 'app-debug-apk'."
            echo "=========================================================="
            
            {
              echo "### ⚠️ Debug APK Built (Release Publishing Failed)"
              echo ""
              echo "The APK was compiled successfully, but GitHub Release creation encountered an issue."
              echo "- **Backup Artifact:** You can download the APK from the workflow run artifacts named \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
